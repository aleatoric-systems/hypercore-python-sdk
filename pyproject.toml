[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypercore-sdk"
version = "0.3.0"
description = "Aleatoric Systems Hypercore Python SDK for Hyperliquid market data, gRPC, and signed trading actions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "grpcio>=1.66.0,<1.72.0",
  "grpcio-health-checking>=1.66.0,<1.72.0",
  "grpcio-reflection>=1.66.0,<1.72.0",
  "protobuf>=5.26.1,<6.0.0",
  "httpx>=0.27.0",
  "websockets>=12.0",
  "hyperliquid-python-sdk>=0.22.0",
]

[project.scripts]
hypercore-sdk = "hypercore_sdk.cli:main"

[tool.setuptools]
packages = ["hypercore_sdk", "hypercore_sdk.proto"]

[tool.setuptools.package-dir]
hypercore_sdk = "."
"hypercore_sdk.proto" = "proto"
